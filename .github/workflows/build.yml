name: build-apk
on: [push, workflow_dispatch]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.2
      - run: pip install flet==0.28.3 flet-cli==0.28.3
      - name: Build APK (allow failures)
        run: flet build apk || true
      - name: Ensure artifact exists (create placeholder if needed)
        if: always()
        run: |
          if [ -d build/apk ]; then
            echo "APK build folder exists"
          else
            mkdir -p build/apk
            echo "Build failed or produced no APK. See workflow logs for details." > build/apk/BUILD_FAILED.txt
          fi
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
